{% extends "base.html" %}
{% block title %}שחזור סיסמה | תדר{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>שכחתי סיסמה</h1>
  <p class="muted-line">יש להזין את האימייל של החשבון כדי לקבל קישור בטוח לאיפוס סיסמה.</p>
  <form method="post" class="form">
    <label for="email">אימייל</label>
    <input id="email" name="email" type="email" required autocomplete="email" />
    <button type="submit">שלח קישור לאיפוס</button>
  </form>

  <p class="muted-line"><a href="{{ url_for('login') }}">חזרה לכניסה</a></p>
</section>
{% endblock %}
