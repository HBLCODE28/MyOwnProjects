{% extends "base.html" %}
{% block title %}איפוס סיסמה | תדר{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>איפוס סיסמה</h1>
  <p class="muted-line">הקישור נבדק ונמצא תקין. יש לבחור סיסמה חדשה.</p>
  <form method="post" class="form">
    <label for="password">סיסמה חדשה</label>
    <input id="password" name="password" type="password" required minlength="6" />

    <label for="confirm_password">אישור סיסמה</label>
    <input id="confirm_password" name="confirm_password" type="password" required minlength="6" />

    <button type="submit">עדכון סיסמה</button>
  </form>
</section>
{% endblock %}
